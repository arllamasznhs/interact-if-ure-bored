<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Extremely Unnecessary Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#29273d;background:linear-gradient(135deg,#ffd9e9,#ddd9ff 50%,#caf3ff);display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}.blob{position:fixed;width:190px;height:190px;border-radius:50%;opacity:.3;filter:blur(3px);pointer-events:none;animation:float 7s ease-in-out infinite}.one{background:#ff9fc4;top:-65px;left:-55px}.two{background:#9edcff;right:-65px;bottom:-55px;animation-delay:-3s}.app{width:min(760px,100%);position:relative;z-index:1}.card{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:30px;box-shadow:0 24px 70px rgba(70,50,100,.18);padding:clamp(24px,5vw,46px);overflow:hidden}.screen{display:none}.screen.active{display:block;animation:enter .4s ease}.eyebrow{font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;opacity:.55;margin-bottom:12px}h1{font-size:clamp(2.2rem,7vw,4.5rem);line-height:.96;letter-spacing:-.055em;margin:0 0 18px}h2{font-size:clamp(1.55rem,4vw,2.25rem);line-height:1.1;letter-spacing:-.035em;margin:0 0 24px}.sub{max-width:580px;font-size:1.05rem;opacity:.72;line-height:1.65;margin-bottom:28px}.emoji-orbit{height:90px;position:relative}.emoji-orbit span{position:absolute;font-size:2.3rem;animation:bob 3s ease-in-out infinite}.emoji-orbit span:nth-child(1){left:2%;top:20%}.emoji-orbit span:nth-child(2){left:28%;top:0;animation-delay:-.8s}.emoji-orbit span:nth-child(3){right:30%;top:18%;animation-delay:-1.5s}.emoji-orbit span:nth-child(4){right:2%;top:0;animation-delay:-2.2s}button{font:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{background:#29273d;color:white;padding:15px 22px;border-radius:15px;font-weight:800;transition:.18s;box-shadow:0 10px 24px rgba(37,36,58,.2)}.primary:hover{transform:translateY(-2px)}.tiny{margin-top:18px;font-size:.82rem;opacity:.45}.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.counter{font-size:.85rem;font-weight:800;opacity:.5}.progress{height:9px;border-radius:99px;background:rgba(37,36,58,.1);overflow:hidden;margin-bottom:32px}.progress>div{height:100%;width:0;background:#29273d;border-radius:inherit;transition:width .35s ease}.options{display:grid;gap:12px}.option{width:100%;text-align:left;background:rgba(255,255,255,.7);border:2px solid rgba(37,36,58,.08);padding:16px 17px;border-radius:17px;font-weight:700;color:#29273d;transition:.18s}.option:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(37,36,58,.25);background:#fff}.option:disabled{cursor:default}.letter{display:inline-flex;width:30px;height:30px;border-radius:10px;align-items:center;justify-content:center;margin-right:10px;background:rgba(37,36,58,.08);font-size:.82rem}.reaction{min-height:28px;margin-top:16px;font-size:.9rem;font-weight:800;opacity:0;transform:translateY(5px);transition:.25s}.reaction.show{opacity:1;transform:none}.result-badge{font-size:5rem;line-height:1;margin:5px 0 15px}.result-title{font-size:clamp(2rem,7vw,3.7rem);letter-spacing:-.05em;line-height:.95;margin:0 0 16px}.result-box{background:rgba(255,255,255,.62);border-radius:20px;padding:20px;margin:22px 0}.result-box h3{margin:0 0 10px}.result-box p{line-height:1.6;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 24px}.stat{background:rgba(37,36,58,.06);border-radius:16px;padding:13px;text-align:center}.stat strong{display:block;font-size:1.25rem}.stat span{font-size:.72rem;opacity:.55}.hidden-message{margin-top:26px;padding-top:20px;border-top:1px solid rgba(37,36,58,.1);font-size:.9rem;opacity:.72;line-height:1.6}.footer-note{text-align:center;margin-top:22px;font-size:.8rem;opacity:.45}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12px) rotate(5deg)}}@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(15px,-18px)}}@media(max-width:560px){body{padding:10px}.card{border-radius:24px;padding:25px 20px}.option{padding:14px}}
</style>
</head>
<body>
<div class="blob one"></div><div class="blob two"></div>
<main class="app"><section class="card">
<div id="startScreen" class="screen active">
<div class="emoji-orbit"><span>🐱</span><span>🐶</span><span>🐹</span><span>🦙</span></div>
<div class="eyebrow">Just to kill time</div>
<h1>Anything and Random </h1>
<p class="sub">It's just random stuff. Answer if you'd like.</p>
<button class="primary" onclick="startQuiz()">To start or not to start, that is the question →</button>
<div class="tiny">Estimated waste of time it will take from you: approximately 2 minutes. Side effects may include: being weirded out, more boredom, and the likes.</div>
</div>
<div id="quizScreen" class="screen">
<div class="quiz-top"><div class="eyebrow" style="margin:0">Question</div><div class="counter" id="counter">1 / 10</div></div>
<div class="progress"><div id="progressBar"></div></div><h2 id="question"></h2><div class="options" id="options"></div><div class="reaction" id="reaction"></div>
</div>
</section></main>
<script>
const questions=[
{q:"If tiny, arnie, or tannie suddenly became human for 24 hours, what's the first thing they'd tell you?",options:["I feel violated whenever you smell my balls","Both of us at times dont take a bath but why am I the only one catching strays?","My brain got mumbo'ed jumbo'ed when your cuteness agression strikes","I'm not maitim, just congratulations"],reactions:["Arnie and his big ballz","She's not amoy pisti kaya","Price they have to pay for being so cute","Lowkey racer"]},
{q:"What do you feel right now",options:["I feel so criminilogy rn","I feel so tourism rn","I feel so civil engr rn","I feel so nursing rn"],reactions:["whyyy","wher u wanna go?","hahaha das okay i know u still smell so good","dont u wanna sleep?"]},
{q:"If you must fight someone in your palengke in Kapitan Pepe for the last piece of kalamay, who would it be?",options:["Mama ni Carlos Yulo","Otlum","Sara Duterte","Mommy Oni"],reactions:["Po-post ka niyan sa FB.","Hindi masama ang ginawa mo. Kasi ang konsensya mo ay clear.","Bahala na kayo sa buhay ninyo, basta ako, nakaangat na ako.","Napaganon ako sayo oh. Ay pota-"]},
{q:"You must arrange for someone to deliver your food, who would it be?",options:["GV Express","GV Express","GV Express.","Food Panda"],reactions:["hahahaha","Shore?","😭","Buti naman"]},
{q:"Choose one superpower (it has its drawbacks).",options:["Immortal ka pero bed ridden","May lazer eyes ka pero magagamit mo lang siya kapag may sore eyes ka","Puwede ka maging invisible pero 70% opacity mo","May super speed ka pero paraplegic ka"],reactions:["Great power comes with great responsibility.","Matchy-matchy.","Puwede na rin.","Hey, Joe!."]},
{q:"What's your vocal stim for the day?",options:["winsdeeeeyyy naaaaa","suntukan tayo right neow","oh cmon","meron din naman palang ganda ang buhay..PWEDE NANG MANGARAP"],reactions:["YESSSSS","Mag k-KFC ako","What is it, Simon?","Our battle will be legendary - Team Ryzza"]},
{q:"You have two birds, si giripit and si garapat. Lumipad si garapat, sino naiwan?",options:["Si Garapat","Si Girirpit","Si Giripit","Si Garapat"],reactions:["Weh","Think about it","Shore?","hahahahaha"]},
{q:"What would you do if may biglang huminto sa harap mo and tinanong ka niya ng 'kilala mo ko?', what would you do?",options:["Say 'never grow old'","Dedma","Report kay kuya Benitez","The Bird"],reactions:["EZ Money ba","So taray","hahahaha","Oh, put that down!"]},
{q:"If you must pick a random phrase that you will say every 5 mins, what would it be?",options:["me hoy menoy","papipapiboommm","shogyo mogyo","noodles, dont noodles"],reactions:["Traffic cone energy detected.","That spoon is suspiciously oversized.","The duck is now your legal advisor.","Excellent wallet material."]},
{q:"Asnwer or fill in the missing context",options:["malaking epekto ang pagkawala-","AHHHHH Mi-","Gud afternun ebriwan. Junafie, kumakain ka ba ng sitaw?","Tangina mo. Lamunin mo yang tae mo-"],reactions:["jison titum","miguel","Bakit?","Otlum nadulas sa basketball court"]}
]; 
let current=0,answers=[];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function startQuiz(){current=0;answers=[];show('quizScreen');renderQuestion()}
function renderQuestion(){const item=questions[current];document.getElementById('counter').textContent=`${current+1} / ${questions.length}`;document.getElementById('progressBar').style.width=`${current/questions.length*100}%`;document.getElementById('question').textContent=item.q;const box=document.getElementById('options');box.innerHTML='';['A','B','C','D'].forEach((l,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="letter">${l}</span>${item.options[i]}`;b.onclick=()=>choose(i);box.appendChild(b)});const r=document.getElementById('reaction');r.className='reaction';r.textContent=''}
function choose(index){const item=questions[current];answers.push(index);document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;b.style.opacity=i===index?'1':'.45';if(i===index)b.style.borderColor='rgba(37,36,58,.35)'});const r=document.getElementById('reaction');r.textContent=item.reactions[index];r.classList.add('show');setTimeout(()=>{current++;if(current<questions.length)renderQuestion();else finishQuiz()},650)}
function finishQuiz(){
  document.getElementById('progressBar').style.width='100%';
  document.getElementById('question').textContent='You survived all 10 questions.';
  document.getElementById('options').innerHTML='<button class="primary" onclick="restartQuiz()">Do it again if ure really bored →</button>';
  document.getElementById('reaction').textContent='Congratulations. I have officially wasted approximately 2 minutes of your life.';
  document.getElementById('reaction').classList.add('show');
}
function restartQuiz(){startQuiz()}
</script>
</body>
</html>
